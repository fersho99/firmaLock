<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #14110D;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }
    #wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
    }
    #pageCanvas {
      background: #fff;
      box-shadow: 0 0 12px rgba(0,0,0,0.5);
      touch-action: manipulation;
    }
    #marker {
      position: absolute;
      width: 18px;
      height: 18px;
      margin-left: -9px;
      margin-top: -9px;
      border-radius: 9px;
      border: 2px solid #E8B94A;
      background: rgba(232, 185, 74, 0.35);
      pointer-events: none;
      display: none;
    }
    #status {
      position: fixed;
      top: 8px;
      left: 8px;
      color: #7C8A80;
      font-family: sans-serif;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="status">Cargando…</div>
  <div id="wrap">
    <canvas id="pageCanvas"></canvas>
  </div>
  <div id="marker"></div>

  <script src="pdf.min.js"></script>
  <script>
    function onRNMessage(handler) {
      document.addEventListener('message', handler);
      window.addEventListener('message', handler);
    }
    function postToRN(obj) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(obj));
      }
    }

    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';

    var pdfDoc = null;
    var currentPageNum = 1;
    var currentViewport = null;
    var canvas = document.getElementById('pageCanvas');
    var ctx = canvas.getContext('2d');
    var marker = document.getElementById('marker');
    var statusEl = document.getElementById('status');

    function base64ToUint8Array(base64) {
      var raw = atob(base64);
      var arr = new Uint8Array(raw.length);
      for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
      return arr;
    }

    function renderPage(num) {
      if (!pdfDoc) return;
      pdfDoc.getPage(num).then(function (page) {
        var containerWidth = window.innerWidth - 24;
        var baseViewport = page.getViewport({ scale: 1 });
        var scale = containerWidth / baseViewport.width;
        var viewport = page.getViewport({ scale: scale });
        currentViewport = viewport;
        currentPageNum = num;
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        var renderContext = { canvasContext: ctx, viewport: viewport };
        page.render(renderContext).promise.then(function () {
          statusEl.textContent = 'Página ' + num + ' / ' + pdfDoc.numPages;
          marker.style.display = 'none';
          postToRN({ type: 'pageRendered', page: num, numPages: pdfDoc.numPages });
        });
      });
    }

    function loadDocument(base64, gotoPage) {
      statusEl.textContent = 'Cargando…';
      var data = base64ToUint8Array(base64);
      window.pdfjsLib.getDocument({ data: data }).promise.then(function (pdf) {
        pdfDoc = pdf;
        postToRN({ type: 'loaded', numPages: pdf.numPages });
        renderPage(gotoPage || 1);
      }).catch(function (err) {
        postToRN({ type: 'error', message: String(err) });
      });
    }

    canvas.addEventListener('click', function (evt) {
      if (!currentViewport) return;
      var rect = canvas.getBoundingClientRect();
      var x = (evt.clientX - rect.left) * (canvas.width / rect.width);
      var y = (evt.clientY - rect.top) * (canvas.height / rect.height);

      marker.style.display = 'block';
      marker.style.left = evt.clientX + 'px';
      marker.style.top = evt.clientY + 'px';

      var pdfPoint = currentViewport.convertToPdfPoint(x, y);
      postToRN({
        type: 'tap',
        page: currentPageNum,
        pdfX: pdfPoint[0],
        pdfY: pdfPoint[1],
        pageWidthPt: currentViewport.width / currentViewport.scale,
        pageHeightPt: currentViewport.height / currentViewport.scale,
      });
    });

    onRNMessage(function (evt) {
      try {
        var msg = JSON.parse(evt.data);
        if (msg.type === 'load') {
          loadDocument(msg.base64, msg.page);
        } else if (msg.type === 'goToPage') {
          renderPage(msg.page);
        }
      } catch (e) {
        postToRN({ type: 'error', message: String(e) });
      }
    });

    postToRN({ type: 'ready' });
  </script>
</body>
</html>
