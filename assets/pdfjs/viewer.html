<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #F6F2FB;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }
    #wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
    }
    #pageCanvas {
      background: #fff;
      box-shadow: 0 0 12px rgba(0,0,0,0.5);
      touch-action: manipulation;
    }
    /* Recuadro que representa el tamaño/posición exacta donde caerá la
       firma. Se puede arrastrar (touch-action: none evita que el scroll
       del contenedor #wrap "robe" el gesto de arrastre). */
    #placementBox {
      position: absolute;
      display: none;
      border: 2px dashed #7C3AED;
      background: rgba(124, 58, 237, 0.12);
      border-radius: 6px;
      touch-action: none;
      cursor: move;
    }
    #placementBox::after {
      content: 'Arrastra para ajustar';
      position: absolute;
      bottom: 100%;
      left: 0;
      margin-bottom: 4px;
      font-family: sans-serif;
      font-size: 10px;
      color: #7C3AED;
      background: rgba(255,255,255,0.9);
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }
    #status {
      position: fixed;
      top: 8px;
      left: 8px;
      color: #7A6E8C;
      font-family: sans-serif;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="status">Cargando…</div>
  <div id="wrap">
    <canvas id="pageCanvas"></canvas>
  </div>
  <div id="placementBox"></div>

  <script src="pdf.min.js"></script>
  <script>
    // Puente RN <-> WebView. Android entrega mensajes por 'message' en
    // document, iOS/algunos casos por 'message' en window; escuchamos ambos.
    function onRNMessage(handler) {
      document.addEventListener('message', handler);
      window.addEventListener('message', handler);
    }
    function postToRN(obj) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(obj));
      }
    }

    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';

    // Deben coincidir con SIGNATURE_WIDTH_PT / SIGNATURE_HEIGHT_PT en
    // src/lib/pdfSign.ts, para que el recuadro que se ve aquí sea del mismo
    // tamaño que la imagen que realmente se estampa en el PDF.
    var SIGNATURE_WIDTH_PT = 150;
    var SIGNATURE_HEIGHT_PT = 60;

    var pdfDoc = null;
    var currentPageNum = 1;
    var currentViewport = null;
    var canvas = document.getElementById('pageCanvas');
    var ctx = canvas.getContext('2d');
    var box = document.getElementById('placementBox');
    var statusEl = document.getElementById('status');

    // Posición del recuadro en coordenadas de pantalla (client px). Se
    // guarda como el punto "inferior-centro" (donde tocaste), igual que
    // antes usaba el marcador, para que al confirmar el ancla siga siendo
    // consistente con cómo pdfSign.ts centra la imagen horizontalmente y la
    // hace crecer hacia arriba desde el punto tocado.
    var boxAnchorX = 0;
    var boxAnchorY = 0;
    var boxWidthPx = 0;
    var boxHeightPx = 0;
    var dragging = false;
    var dragOffsetX = 0;
    var dragOffsetY = 0;

    function base64ToUint8Array(base64) {
      var raw = atob(base64);
      var arr = new Uint8Array(raw.length);
      for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
      return arr;
    }

    function hideBox() {
      box.style.display = 'none';
    }

    function updateBoxStyle() {
      box.style.width = boxWidthPx + 'px';
      box.style.height = boxHeightPx + 'px';
      box.style.left = (boxAnchorX - boxWidthPx / 2) + 'px';
      box.style.top = (boxAnchorY - boxHeightPx) + 'px';
    }

    // Convierte el ancla actual del recuadro (pantalla) a coordenadas PDF y
    // lo manda a RN. Se llama al tocar por primera vez y en cada paso del
    // arrastre, así RN siempre tiene la posición más reciente lista para
    // cuando el usuario presione "Firmar aquí".
    function reportBoxPosition() {
      if (!currentViewport) return;
      var rect = canvas.getBoundingClientRect();
      var cx = (boxAnchorX - rect.left) * (canvas.width / rect.width);
      var cy = (boxAnchorY - rect.top) * (canvas.height / rect.height);
      var pdfPoint = currentViewport.convertToPdfPoint(cx, cy);
      postToRN({
        type: 'tap',
        page: currentPageNum,
        pdfX: pdfPoint[0],
        pdfY: pdfPoint[1],
        pageWidthPt: currentViewport.width / currentViewport.scale,
        pageHeightPt: currentViewport.height / currentViewport.scale,
      });
    }

    function placeBoxAt(clientX, clientY) {
      if (!currentViewport) return;
      var rect = canvas.getBoundingClientRect();
      var pxPerCanvasPx = rect.width / canvas.width;
      boxWidthPx = SIGNATURE_WIDTH_PT * currentViewport.scale * pxPerCanvasPx;
      boxHeightPx = SIGNATURE_HEIGHT_PT * currentViewport.scale * pxPerCanvasPx;
      boxAnchorX = clientX;
      boxAnchorY = clientY;
      updateBoxStyle();
      box.style.display = 'block';
      reportBoxPosition();
    }

    function renderPage(num) {
      if (!pdfDoc) return;
      pdfDoc.getPage(num).then(function (page) {
        var containerWidth = window.innerWidth - 24;
        var baseViewport = page.getViewport({ scale: 1 });
        var scale = containerWidth / baseViewport.width;
        var viewport = page.getViewport({ scale: scale });
        currentViewport = viewport;
        currentPageNum = num;
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        var renderContext = { canvasContext: ctx, viewport: viewport };
        page.render(renderContext).promise.then(function () {
          statusEl.textContent = 'Página ' + num + ' / ' + pdfDoc.numPages;
          hideBox();
          postToRN({ type: 'pageRendered', page: num, numPages: pdfDoc.numPages });
        });
      });
    }

    function loadDocument(base64, gotoPage) {
      statusEl.textContent = 'Cargando…';
      hideBox();
      var data = base64ToUint8Array(base64);
      window.pdfjsLib.getDocument({ data: data }).promise.then(function (pdf) {
        pdfDoc = pdf;
        postToRN({ type: 'loaded', numPages: pdf.numPages });
        renderPage(gotoPage || 1);
      }).catch(function (err) {
        postToRN({ type: 'error', message: String(err) });
      });
    }

    canvas.addEventListener('click', function (evt) {
      if (!currentViewport) return;
      placeBoxAt(evt.clientX, evt.clientY);
    });

    box.addEventListener('pointerdown', function (evt) {
      dragging = true;
      dragOffsetX = evt.clientX - boxAnchorX;
      dragOffsetY = evt.clientY - boxAnchorY;
      try { box.setPointerCapture(evt.pointerId); } catch (e) {}
      evt.preventDefault();
    });
    box.addEventListener('pointermove', function (evt) {
      if (!dragging) return;
      boxAnchorX = evt.clientX - dragOffsetX;
      boxAnchorY = evt.clientY - dragOffsetY;
      updateBoxStyle();
      reportBoxPosition();
      evt.preventDefault();
    });
    function endDrag() {
      dragging = false;
    }
    box.addEventListener('pointerup', endDrag);
    box.addEventListener('pointercancel', endDrag);

    onRNMessage(function (evt) {
      try {
        var msg = JSON.parse(evt.data);
        if (msg.type === 'load') {
          loadDocument(msg.base64, msg.page);
        } else if (msg.type === 'goToPage') {
          renderPage(msg.page);
        } else if (msg.type === 'hideBox') {
          hideBox();
        }
      } catch (e) {
        postToRN({ type: 'error', message: String(e) });
      }
    });

    postToRN({ type: 'ready' });
  </script>
</body>
</html>
